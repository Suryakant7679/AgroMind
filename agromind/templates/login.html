{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:30rem;margin:auto">
    <h1>Login</h1>
    <p class="muted">Use your registered email and password.</p>
    {% if message %}<p class="error">{{ message }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row"><label>Email</label><input name="email" type="email" required placeholder="user@example.com"></div>
      <div class="form-row"><label>Password</label><input name="password" type="password" required placeholder="Enter your password"></div>
      <button class="button" type="submit">Continue</button>
    </form>
    <p class="muted" style="margin-top:1rem">New here? <a href="/signup">Create an account</a>.</p>
  </div>
{% endblock %}
