{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:30rem;margin:auto">
    <h1>Create Account</h1>
    <p class="muted">Choose how you want to verify your AgroMind AI account.</p>
    {% if message %}<p class="error">{{ message }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>Full name</label>
        <input name="full_name" type="text" placeholder="AgroMind User">
      </div>
      <div class="form-row">
        <label>Email</label>
        <input name="email" type="email" required placeholder="user@example.com">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input name="password" type="password" required minlength="6" placeholder="Minimum 6 characters">
      </div>
      <div class="form-row">
        <label>Verification method</label>
        <div style="display:grid;gap:0.75rem">
          <label style="display:flex;gap:0.65rem;align-items:flex-start;padding:0.8rem;border:1px solid rgba(255,255,255,0.12);border-radius:8px;cursor:pointer">
            <input name="verification_method" type="radio" value="link" checked style="margin-top:0.2rem">
            <span>
              <strong>Email confirmation link</strong><br>
              <span class="muted">We will send a Supabase confirmation link. After confirming, log in with your password.</span>
            </span>
          </label>
          <label style="display:flex;gap:0.65rem;align-items:flex-start;padding:0.8rem;border:1px solid rgba(255,255,255,0.12);border-radius:8px;cursor:pointer">
            <input name="verification_method" type="radio" value="otp" style="margin-top:0.2rem">
            <span>
              <strong>6-digit OTP code</strong><br>
              <span class="muted">We will send a one-time code and open the OTP verification page.</span>
            </span>
          </label>
        </div>
      </div>
      <button class="button" type="submit">Sign up</button>
    </form>
    <p class="muted" style="margin-top:1rem">Already have an account? <a href="/login">Login</a>.</p>
  </div>
{% endblock %}
