{% extends "base.html" %}
{% block content %}
  <div class="card" style="max-width:30rem;margin:auto">
    <h1>Create Account</h1>
    <p class="muted">Choose how you want to verify your AgroMind AI account.</p>
    {% if message %}<p class="error">{{ message }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="form-row">
        <label>Full name</label>
        <input name="full_name" type="text" placeholder="AgroMind User">
      </div>
      <div class="form-row">
        <label>Email</label>
        <input name="email" type="email" required placeholder="user@example.com">
      </div>
      <div class="form-row">
        <label>Password</label>
        <input name="password" type="password" required minlength="6" placeholder="Minimum 6 characters">
      </div>
      <div class="form-row">
        <label>Verification</label>
        <div class="verification-options">
          <label class="verification-option">
            <input type="radio" name="verification_method" value="link" checked>
            <span>
              <strong>Email link</strong>
              <small>Open the confirmation link from your inbox.</small>
            </span>
          </label>
          <label class="verification-option">
            <input type="radio" name="verification_method" value="otp">
            <span>
              <strong>6-digit OTP</strong>
              <small>Enter a code after it arrives by email.</small>
            </span>
          </label>
        </div>
      </div>

      <button class="button" type="submit" data-loading-text="Sending verification...">Sign up</button>
    </form>
    <p class="muted" style="margin-top:1rem">Already have an account? <a href="/login">Login</a>.</p>
  </div>
  <script>
    document.currentScript.closest(".card").querySelector("form").addEventListener("submit", (event) => {
      const button = event.currentTarget.querySelector("button[type='submit']");
      button.disabled = true;
      button.textContent = button.dataset.loadingText || "Please wait...";
    });
  </script>
{% endblock %}
