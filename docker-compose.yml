name: agromind

x-runtime-environment: &runtime-environment
  AIOS_HOST: 0.0.0.0
  AIOS_PORT: "8000"
  AIOS_STORAGE_BACKEND: postgres
  DATABASE_URL: postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Compose env file}@postgres:5432/${POSTGRES_DB:-aios}
  AGROMIND_DATABASE_URL: ""
  REDIS_URL: redis://redis:6379/0
  AIOS_VECTOR_BACKEND: chroma
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  QDRANT_URL: ""
  QDRANT_API_KEY: ""

x-aios-service: &aios-service
  image: ${AIOS_IMAGE:-agromind:local}
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - ${AIOS_ENV_FILE:-.env.production}
  environment: *runtime-environment
  restart: unless-stopped
  volumes:
    - aios_data:/app/data
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    chroma:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your Compose env file}
      POSTGRES_DB: ${POSTGRES_DB:-aios}
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  chroma:
    image: ${AIOS_IMAGE:-agromind:local}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["chroma", "run", "--host", "0.0.0.0", "--port", "8000", "--path", "/app/data/chroma"]
    restart: unless-stopped
    volumes:
      - chroma_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/heartbeat', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [backend]

  migrate:
    image: ${AIOS_IMAGE:-agromind:local}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${AIOS_ENV_FILE:-.env.production}
    environment: *runtime-environment
    command: ["python", "-m", "app.migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    <<: *aios-service
    command: ["python", "-m", "app.main"]
    ports: ["127.0.0.1:${AI_TUTOR_DOCKER_PORT:-18010}:8000"]
    networks: [backend, edge]

  portal:
    <<: *aios-service
    command: ["python", "-m", "uvicorn", "agromind.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *runtime-environment
      AI_TUTOR_URL: http://127.0.0.1:${AI_TUTOR_DOCKER_PORT:-18010}
    ports: ["127.0.0.1:${AGROMIND_DOCKER_PORT:-18080}:8000"]
    volumes:
      - aios_data:/app/data
      - agromind_uploads:/app/agromind/static/uploads
    networks: [backend, edge]

  worker:
    <<: *aios-service
    command: ["python", "-m", "app.workers", "--worker", "all", "--poll-timeout", "2"]
    healthcheck:
      disable: true
    networks: [backend, edge]

  scheduler:
    <<: *aios-service
    command: ["python", "-m", "app.workers", "--worker", "scheduler", "--poll-timeout", "5"]
    healthcheck:
      disable: true
    networks: [backend, edge]

  monitoring:
    <<: *aios-service
    command: ["python", "-m", "app.workers", "--worker", "health", "--poll-timeout", "5"]
    healthcheck:
      disable: true
    networks: [backend, edge]

  nginx:
    profiles: ["tls"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge]

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  aios_data:
  agromind_uploads:

networks:
  backend:
    internal: true
  edge: